[project]
name = "data-analyzer-pro"
version = "1.0.0"
description = "Analizador de Datos Profesional con Interfaz Gráfica"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "openpyxl>=3.1.0",
    "scipy>=1.11.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0.0",
    "pyarrow>=14.0.0",
    "odfpy>=1.4.1",
    "pyxlsb>=1.0.10",
    "dbfread>=2.0.7",
    "fastavro>=1.9.0",
    "toml>=0.10.2",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends._legacy:_Backend"
